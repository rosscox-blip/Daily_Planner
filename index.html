<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Planner &mdash; Software Customisations</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
[data-netlify-identity-button]{display:none!important}
:root{--bg:#0e0e20;--bg2:#13132e;--text:#d8d8f0;--muted:#8888c0;--pink:#e91e8c;--border:#26265a}
[data-theme="light"]{--bg:#f0f0f8;--bg2:#ffffff;--text:#1a1a3a;--muted:#5050a0;--border:#d0d0e8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
     background:var(--bg);color:var(--text);display:flex;flex-direction:column;
     align-items:center;justify-content:center;min-height:100vh;padding:24px}
h1{font-size:1.6rem;font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);font-size:.82rem;margin-bottom:36px;text-align:center}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px}
.member-link{display:flex;align-items:center;gap:12px;background:var(--bg2);
             border:1px solid var(--border);border-radius:10px;padding:14px 22px;
             text-decoration:none;color:var(--text);transition:all .15s;min-width:150px}
.member-link:hover{border-color:var(--pink);color:#fff;background:#1e1e48}
[data-theme="light"] .member-link:hover{color:var(--text);background:#e8e8f8}
.mi{width:34px;height:34px;background:var(--pink);border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:.95rem;color:#fff;flex-shrink:0}
.mn{font-weight:600;font-size:.95rem}
footer{margin-top:40px;color:var(--muted);font-size:.72rem;text-align:center}
.theme-btn{position:fixed;top:16px;right:16px;background:none;border:1px solid var(--border);
           color:var(--muted);padding:6px 12px;border-radius:6px;font-size:.76rem;cursor:pointer}
.theme-btn:hover{border-color:var(--pink);color:var(--pink)}
</style>
</head>
<body>
<button class="theme-btn" id="theme-btn" onclick="toggleTheme()">&#9728; Light</button>
<h1>Team Planner</h1>
<div class="sub">Software Customisations &mdash; Flowbird / Arrive<br>
Updated 28 Jul 2026, 15:59 &middot; Refreshes hourly</div>
<div class="links"><a href="emie.html" class="member-link"><span class="mi">E</span><span class="mn">Emie</span></a>
<a href="jay.html" class="member-link"><span class="mi">J</span><span class="mn">Jay</span></a>
<a href="rob.html" class="member-link"><span class="mi">R</span><span class="mn">Rob</span></a>
<a href="ross.html" class="member-link"><span class="mi">R</span><span class="mn">Ross</span></a>
<a href="sofia.html" class="member-link"><span class="mi">S</span><span class="mn">Sofia</span></a>
<a href="suna.html" class="member-link"><span class="mi">S</span><span class="mn">Suna</span></a>
<a href="tristan.html" class="member-link"><span class="mi">T</span><span class="mn">Tristan</span></a></div>
<footer>Log in with your work email to view your jobs.<br>Data sourced from the team Google Sheet.</footer>
<script>
(function(){var t=localStorage.getItem('planner_theme')||'dark';document.documentElement.setAttribute('data-theme',t);var b=document.getElementById('theme-btn');if(b)b.innerHTML=t==='dark'?'&#9728; Light':'&#9790; Dark';})();
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('planner_theme',t);var b=document.getElementById('theme-btn');if(b)b.innerHTML=t==='dark'?'&#9728; Light':'&#9790; Dark';}
if(window.netlifyIdentity){
  netlifyIdentity.on('init', function(){});
}
</script>
</body>
</html>
